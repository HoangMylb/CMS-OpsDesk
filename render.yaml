services:
  - type: web
    name: opsdesk-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: 8080
      - key: AutoMigrate
        value: "true"
      - key: AutoSeed
        value: "true"
      # Public, disposable portfolio identities; this is not a production credential.
      - key: DemoSeed__Enabled
        value: "true"
      - key: DemoSeed__Password
        value: "PortfolioDemo!2026"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
