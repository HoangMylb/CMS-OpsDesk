version: "3.9"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64        # Required for Apple Silicon (M1/M2) — SQL Server has no ARM64 image
    container_name: opsdesk-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your environment or .env file}
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    volumes:
      - opsdesk_sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -C"]
      interval: 10s
      retries: 10
      start_period: 30s

volumes:
  opsdesk_sqldata:
