version: "3.9"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64        # Required for Apple Silicon (M1/M2) — SQL Server has no ARM64 image
    container_name: opsdesk-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "OpsDesk_Dev_2024!"
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    volumes:
      - opsdesk_sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "OpsDesk_Dev_2024!", "-Q", "SELECT 1", "-C"]
      interval: 10s
      retries: 10
      start_period: 30s

volumes:
  opsdesk_sqldata:
